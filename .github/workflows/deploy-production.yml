name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spendmap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, per-web, spendmap-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate finance engine
        run: |
          set -euo pipefail
          npm ci
          node --check app.mjs
          node --check auth.mjs
          node --check server.mjs
          npm test
          npm run prepare-public
      - name: Publish atomic static release
        run: |
          set -euo pipefail
          exec 9>/var/lock/per-web-deploy.lock
          flock -w 1800 9
          release="/var/www/spendmap/releases/${GITHUB_SHA}"
          install -d -m 0755 "$release"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='test' \
            ./ "$release/"
          npm ci --omit=dev --prefix "$release"
          ln -sfn "$release" /var/www/spendmap/current.next
          mv -Tf /var/www/spendmap/current.next /var/www/spendmap/current
          nginx -t
          systemctl reload nginx
          systemctl restart spendmap
          curl -fsSL https://spendmap.effectx.com.au/ --output /tmp/spendmap-home.html
          grep -q 'YOUR MONEY, MADE CLEAR' /tmp/spendmap-home.html
          curl --retry 12 --retry-all-errors --retry-delay 1 -fsS \
            https://spendmap.effectx.com.au/api/auth/me --output /tmp/spendmap-auth.json
          grep -q '"user":null' /tmp/spendmap-auth.json
          echo "Production release ${GITHUB_SHA} verified"
