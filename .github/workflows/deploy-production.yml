name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spendmap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, per-web, spendmap-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate finance engine
        run: |
          set -euo pipefail
          node --check app.mjs
          npm test
      - name: Publish atomic static release
        run: |
          set -euo pipefail
          exec 9>/var/lock/per-web-deploy.lock
          flock -w 1800 9
          release="/var/www/spendmap/releases/${GITHUB_SHA}"
          install -d -m 0755 "$release"
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='test' \
            ./ "$release/"
          ln -sfn "$release" /var/www/spendmap/current.next
          mv -Tf /var/www/spendmap/current.next /var/www/spendmap/current
          nginx -t
          systemctl reload nginx
          curl -kfsSL --resolve spendmap.effectx.com.au:443:127.0.0.1 \
            https://spendmap.effectx.com.au/ | grep -q 'YOUR MONEY, MADE CLEAR'
          echo "Production release ${GITHUB_SHA} verified"
