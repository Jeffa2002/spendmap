name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spendmap-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, per-web, spendmap-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate finance engine
        run: |
          set -euo pipefail
          npm ci
          node --check app.mjs
          node --check auth.mjs
          node --check server.mjs
          npm test
          npm run prepare-public
      - name: Publish atomic static release
        run: |
          set -euo pipefail
          exec 9>/var/lock/per-web-deploy.lock
          flock -w 1800 9
          umask 022
          previous="$(readlink -f /var/www/spendmap/current)"
          test -d "$previous"
          release="$(mktemp -d "/var/www/spendmap/releases/${GITHUB_SHA}.XXXXXX")"
          chmod 0755 "$release"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='test' \
            ./ "$release/"
          npm ci --omit=dev --prefix "$release"
          nginx -t
          # Data remains in /var/lib/spendmap. Only this new code release is selected.
          pointer="/var/www/spendmap/current.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          rollback() {
            trap - ERR
            echo "Release health gate failed; restoring the previous code release"
            ln -s "$previous" "$pointer.rollback"
            mv -Tf "$pointer.rollback" /var/www/spendmap/current
            systemctl restart spendmap
            systemctl reload nginx
            curl --retry 12 --retry-all-errors --retry-delay 1 -fsS \
              http://127.0.0.1:3308/api/auth/me -o /dev/null
            exit 1
          }
          trap rollback ERR
          ln -s "$release" "$pointer"
          mv -Tf "$pointer" /var/www/spendmap/current
          systemctl reload nginx
          systemctl restart spendmap
          curl -fsSL https://spendmap.effectx.com.au/ --output /tmp/spendmap-home.html
          grep -q 'YOUR MONEY, MADE CLEAR' /tmp/spendmap-home.html
          curl --retry 12 --retry-all-errors --retry-delay 1 -fsS \
            https://spendmap.effectx.com.au/api/auth/me --output /tmp/spendmap-auth.json
          grep -q '"user":null' /tmp/spendmap-auth.json
          trap - ERR
          echo "Production release ${GITHUB_SHA} verified"
