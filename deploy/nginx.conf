server {
    server_name spendmap.effectx.com.au;

    root /var/www/spendmap/current;
    index index.html;
    include /etc/nginx/snippets/browser-security-baseline.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/public-rate-limit.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3308;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
    location ~ /\. { deny all; }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/spendmap.effectx.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spendmap.effectx.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name spendmap.effectx.com.au;
    return 301 https://$host$request_uri;
}
