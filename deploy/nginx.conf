server {
    listen 80;
    listen [::]:80;
    server_name spendmap.effectx.com.au;

    root /var/www/spendmap/current;
    index index.html;
    include /etc/nginx/snippets/browser-security-baseline.conf;
    include /etc/nginx/snippets/cloudflare-only.conf;
    include /etc/nginx/snippets/public-rate-limit.conf;

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
    location ~ /\. { deny all; }
}
